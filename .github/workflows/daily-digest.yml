name: 每日 AI 科技早報

on:
  schedule:
    # 台灣時間每天 06:30（UTC 22:30）。GitHub 排程常延遲 10 到 30 分鐘，所以提早開始。
    - cron: "30 22 * * *"
    # 備援：GitHub 偶爾會漏跑排程。已經產生今天早報的話，這兩次會自動略過。
    - cron: "10 23 * * *"
    - cron: "10 0 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = 完整執行；notion_only = 只把今天的早報補寫進 Notion；test = 試跑（不寄信、不寫 Notion、不存檔）"
        type: choice
        options: [full, notion_only, test]
        default: full
      radar_date:
        description: "（測試用）指定讀取 AI 日報平台哪一天的貼文，格式 YYYY-MM-DD；留空為今天"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # 一律在 main 上執行並把結果存回 main（OpenMausBot 讀 main 的 data/latest.md）
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 檢查今天是否已產生
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "data/$(TZ=Asia/Taipei date +%F)/digest.json" ]; then
            echo "今天的早報已經產生，略過這次排程"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 只同步 Notion
        if: ${{ inputs.mode == 'notion_only' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
        run: python -m news_push.summarize --notion-only

      - name: 第 1 步：抓取與分類
        if: ${{ inputs.mode != 'notion_only' && steps.guard.outputs.skip != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RADAR_DATE: ${{ inputs.radar_date }}
        run: python -m news_push.fetch

      - name: 第 2 步：AI 挑選、摘要、寄 Email、同步 Notion
        if: ${{ inputs.mode != 'notion_only' && steps.guard.outputs.skip != 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
        run: python -m news_push.summarize ${{ inputs.mode == 'test' && '--no-email --no-notion' || '' }}

      - name: 試跑結果
        if: ${{ inputs.mode == 'test' }}
        run: |
          python -m news_push.source_report --days 1
          python -c "import json,glob;d=json.load(open(sorted(glob.glob('data/*/candidates.json'))[-1]));[print('LAB', i['source'], i['title'], i['url'], i.get('stars')) for i in d['categories']['lab']['items']]"
          grep -n -A3 "AI研究所" data/latest.md | head -60
          if [ -n "${{ inputs.radar_date }}" ]; then python -m news_push.radar_outline "${{ inputs.radar_date }}"; fi

      - name: 失敗提醒（寄警示信，並把早報換成失敗通知）
        if: ${{ failure() && inputs.mode != 'notion_only' && inputs.mode != 'test' }}
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python -m news_push.alert

      - name: 儲存結果到 repo
        if: ${{ always() && inputs.mode != 'test' }}
        run: |
          git config user.name "daily-digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "沒有新內容"
          else
            git commit -m "data: $(TZ=Asia/Taipei date +%F) AI 科技早報"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
