name: 每日 AI 科技早報

on:
  schedule:
    # 台灣時間每天 06:30（UTC 22:30）。GitHub 排程常延遲 10 到 30 分鐘，所以提早開始。
    - cron: "30 22 * * *"
  workflow_dispatch:
  push:
    branches: [claude/project-thread-70x7w4]
    paths: ["news_push/**", ".github/workflows/daily-digest.yml"]

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 第 1 步：抓取與分類
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m news_push.fetch

      - name: 儲存結果到 repo
        run: |
          git config user.name "daily-digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "沒有新內容"
          else
            git commit -m "data: $(TZ=Asia/Taipei date +%F) 候選新聞"
            git pull --rebase
            git push
          fi
