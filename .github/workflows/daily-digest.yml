name: 每日 AI 科技早報

on:
  schedule:
    # 台灣時間每天 06:30（UTC 22:30）。GitHub 排程常延遲 10 到 30 分鐘，所以提早開始。
    - cron: "30 22 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "full = 完整執行；notion_only = 只把今天的早報補寫進 Notion"
        type: choice
        options: [full, notion_only]
        default: full

permissions:
  contents: write

concurrency:
  group: daily-digest
  cancel-in-progress: false

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 只同步 Notion
        if: ${{ inputs.mode == 'notion_only' }}
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
        run: python -m news_push.summarize --notion-only

      - name: 第 1 步：抓取與分類
        if: ${{ inputs.mode != 'notion_only' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m news_push.fetch

      - name: 第 2 步：AI 挑選、摘要、寄 Email、同步 Notion
        if: ${{ inputs.mode != 'notion_only' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODELS: ${{ vars.OPENROUTER_MODELS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
          NVIDIA_MODEL: ${{ vars.NVIDIA_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: ${{ vars.GROQ_MODEL }}
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ vars.NOTION_DATABASE_ID }}
        run: python -m news_push.summarize

      - name: 儲存結果到 repo
        run: |
          git config user.name "daily-digest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "沒有新內容"
          else
            git commit -m "data: $(TZ=Asia/Taipei date +%F) AI 科技早報"
            git pull --rebase
            git push
          fi
